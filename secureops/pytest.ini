[pytest]
minversion = 8.3
testpaths =
    tests
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
addopts =
    --strict-markers
markers =
    unit: fast isolated tests for deterministic logic and local helpers
    integration: tests covering API, database, and service interactions
    validation: controlled corpus and end-to-end validation scenarios
