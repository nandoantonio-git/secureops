openapi: 3.1.0
info:
  title: SecureOps PR Vulnerability Feedback API
  version: 0.1.0
  description: Contract for Pull Request analysis, actionable findings, remediation, restricted gate decisions, and manual overrides.
paths:
  /analyses:
    post:
      summary: Create a Pull Request analysis
      operationId: createAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
      responses:
        '202':
          description: Analysis accepted or started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestAnalysis'
        '400':
          description: Invalid analysis request
  /analyses/{analysisId}:
    get:
      summary: Get analysis result
      operationId: getAnalysis
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Analysis state and summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestAnalysis'
        '404':
          description: Analysis not found
  /analyses/{analysisId}/findings:
    get:
      summary: List findings for an analysis
      operationId: listFindings
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Findings for analysis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Finding'
  /analyses/{analysisId}/gate-decision:
    get:
      summary: Get advisory or blocking decision for an analysis
      operationId: getGateDecision
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Gate decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateDecision'
        '404':
          description: Analysis not found
  /findings/{findingId}:
    get:
      summary: Get finding detail
      operationId: getFinding
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: Finding detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '404':
          description: Finding not found
  /findings/{findingId}/override:
    post:
      summary: Manually override finding status or assessment
      operationId: overrideFinding
      parameters:
        - $ref: '#/components/parameters/FindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideFindingRequest'
      responses:
        '200':
          description: Finding after override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '400':
          description: Invalid override
        '404':
          description: Finding not found
components:
  parameters:
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateAnalysisRequest:
      type: object
      required:
        - repository
        - commit_sha
        - trigger
        - mode
        - changed_files
      properties:
        repository:
          type: string
          examples: ['org/repo']
        pull_request_number:
          type: integer
          minimum: 1
        commit_sha:
          type: string
        trigger:
          type: string
          enum: [pull_request, manual_validation]
        mode:
          type: string
          enum: [advisory, blocking_enabled]
          default: advisory
        changed_files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChangedFile'
    ChangedFile:
      type: object
      required: [path, language, content_ref]
      properties:
        path:
          type: string
        language:
          type: string
          description: Python or the selected secondary language.
        content_ref:
          type: string
          description: Reference to checked-out file content or fixture path; raw code should not be logged.
    PullRequestAnalysis:
      type: object
      required:
        - id
        - repository
        - commit_sha
        - trigger
        - mode
        - status
        - findings_count
      properties:
        id:
          type: string
        repository:
          type: string
        pull_request_number:
          type: integer
        commit_sha:
          type: string
        trigger:
          type: string
          enum: [pull_request, manual_validation]
        mode:
          type: string
          enum: [advisory, blocking_enabled]
        status:
          type: string
          enum: [requested, running, completed, failed]
        findings_count:
          type: integer
          minimum: 0
        failure_reason:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    Finding:
      type: object
      required:
        - id
        - analysis_id
        - file_path
        - line_start
        - language
        - rule_id
        - severity
        - status
        - source
        - remediation
        - detection_signals
      properties:
        id:
          type: string
        analysis_id:
          type: string
        file_path:
          type: string
        line_start:
          type: integer
          minimum: 1
        line_end:
          type: integer
          minimum: 1
        language:
          type: string
        rule_id:
          type: string
        category:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        status:
          type: string
          enum: [open, in_investigation, resolved, false_positive, accepted_risk]
        source:
          type: string
          enum: [primary_language_rule, primary_language_taint, secondary_language_rule, validation_fixture]
        fingerprint:
          type: string
        remediation:
          $ref: '#/components/schemas/RemediationRecommendation'
        detection_signals:
          type: array
          items:
            $ref: '#/components/schemas/DetectionSignal'
        history:
          type: array
          items:
            $ref: '#/components/schemas/FindingHistoryEntry'
    RemediationRecommendation:
      type: object
      required:
        - cause
        - evidence
        - impact
        - recommended_correction
        - safe_example
        - generation_source
        - confidence
      properties:
        cause:
          type: string
        evidence:
          type: string
        impact:
          type: string
        recommended_correction:
          type: string
        safe_example:
          type: string
        generation_source:
          type: string
          enum: [reviewed_template, ollama_contextualized, deterministic_fallback]
        template_id:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
    DetectionSignal:
      type: object
      required: [signal_type, deterministic, summary]
      properties:
        signal_type:
          type: string
          enum: [deterministic_rule, data_flow, template_match, ai_assisted_classification]
        deterministic:
          type: boolean
        summary:
          type: string
    GateDecision:
      type: object
      required: [analysis_id, mode, decision, reasons]
      properties:
        analysis_id:
          type: string
        mode:
          type: string
          enum: [advisory, blocking_enabled]
        decision:
          type: string
          enum: [advisory_only, passed, blocked]
        reasons:
          type: array
          items:
            type: string
        blocking_findings:
          type: array
          items:
            type: string
          description: Finding IDs that justify blocking; each must be critical and supported by deterministic evidence.
    OverrideFindingRequest:
      type: object
      required: [changed_by, change_type, to_value, reason]
      properties:
        changed_by:
          type: string
        change_type:
          type: string
          enum: [status_change, severity_override, risk_acceptance, reopen]
        to_value:
          type: string
        reason:
          type: string
          minLength: 1
    FindingHistoryEntry:
      type: object
      required: [changed_by, change_type, to_value, reason, created_at]
      properties:
        changed_by:
          type: string
        change_type:
          type: string
          enum: [status_change, severity_override, risk_acceptance, reopen]
        from_value:
          type: string
        to_value:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
